<section class="form-section">

<h2>Compra de Ingressos</h2>

<form>

<label>Nome Completo</label>
<input type="text" required>

<label>E-mail</label>
<input type="email" required>

<label>Jogo</label>
<select required>
<option>Brasil x Argentina</option>
<option>França x Alemanha</option>
<option>Espanha x Inglaterra</option>
</select>

<label>Quantidade</label>
<input type="number" min="1" max="10">

<button type="submit">
Finalizar Compra
</button>

</form>
